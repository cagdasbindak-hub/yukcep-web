name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/yukcep-preview.log 2>&1 &

      - name: Wait for preview
        run: npx --yes wait-on http://127.0.0.1:4173

      - name: Smoke test (preview)
        run: npm run smoke
        env:
          YUKCEP_BASE_URL: http://127.0.0.1:4173

      - name: A11y smoke (preview)
        run: npm run a11y:smoke
        env:
          YUKCEP_BASE_URL: http://127.0.0.1:4173

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: tmp/
