name: Post Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL to verify"
        required: true
        default: "https://yukcep.vercel.app/"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Health check
        run: npm run health:check
        env:
          YUKCEP_BASE_URL: ${{ github.event.inputs.base_url }}

      - name: Smoke check
        run: npm run smoke
        env:
          YUKCEP_BASE_URL: ${{ github.event.inputs.base_url }}

      - name: Accessibility smoke
        run: npm run a11y:smoke
        env:
          YUKCEP_BASE_URL: ${{ github.event.inputs.base_url }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-artifacts
          path: tmp/
