name: Health Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        run: npm run health:check
        env:
          YUKCEP_BASE_URL: https://yukcep.vercel.app/

      - name: Upload health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-artifacts
          path: tmp/health/
